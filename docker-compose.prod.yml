services:
  quran-backend:
    # Pull from GHCR for production
    image: ghcr.io/codewithabdou/quran-backend:latest
    container_name: quran-backend
    restart: unless-stopped

    ports:
      - "5000:5000"

    environment:
      - NODE_ENV=production
      - PORT=5000
      # IMPORTANT: Update ALLOWED_ORIGINS to match your exact production frontend domain exact URL
      - ALLOWED_ORIGINS=https://your-frontend-domain.com
      - TRUSTED_IPS=127.0.0.1,::1
      # It's better to pass sensitive keys via a .env file on the VPS rather than hardcoding here
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
      - VAPID_EMAIL=${VAPID_EMAIL}
      - PEXELS_API_KEY=${PEXELS_API_KEY}
      - REDIS_URL=redis://redis:6379

    volumes:
      # Only mapping outputs, not src, because we use the built image in production
      - backend-outputs:/app/outputs

    depends_on:
      redis:
        condition: service_healthy

    labels:
      - "com.centurylinklabs.watchtower.enable=true"

    healthcheck:
      test: [ "CMD", "node", "-e", "fetch('http://localhost:5000/').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  redis:
    image: redis:7-alpine
    container_name: quran-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis-data:/data

    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

    # Memory limit and eviction policy for production
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru

volumes:
  backend-outputs:
    driver: local
  redis-data:
    driver: local
